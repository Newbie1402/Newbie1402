<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Newbie1402 modern GitHub profile card</title>
  <desc id="desc">A compact dark profile card for Newbie1402 with backend focus, stack, and project interests.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="900" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#071B18"/>
      <stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <linearGradient id="line" x1="58" y1="54" x2="842" y2="506" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.55" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 90) rotate(45) scale(240 150)">
      <stop stop-color="#22C55E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 460) rotate(140) scale(260 160)">
      <stop stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="20" y="18" width="860" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="560" rx="30" fill="url(#page)"/>
  <rect width="900" height="560" rx="30" fill="url(#greenGlow)"/>
  <rect width="900" height="560" rx="30" fill="url(#blueGlow)"/>

  <g opacity="0.13">
    <path d="M70 110H830" stroke="#94A3B8"/>
    <path d="M70 230H830" stroke="#94A3B8"/>
    <path d="M70 350H830" stroke="#94A3B8"/>
    <path d="M190 44V516" stroke="#94A3B8"/>
    <path d="M390 44V516" stroke="#94A3B8"/>
    <path d="M590 44V516" stroke="#94A3B8"/>
    <path d="M790 44V516" stroke="#94A3B8"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="54" y="52" width="792" height="456" rx="28" fill="#050A16" stroke="#1E293B"/>
    <rect x="76" y="74" width="748" height="412" rx="22" stroke="url(#line)" stroke-opacity="0.42"/>
  </g>

  <g transform="translate(108 104)">
    <circle cx="68" cy="68" r="50" fill="#020617" stroke="url(#line)" stroke-width="4"/>
    <text x="68" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#F8FAFC">NB</text>
    <text x="0" y="158" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#F8FAFC">Backend Developer</text>
    <text x="0" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94A3B8">Ho Chi Minh City • UTC +07</text>
    <rect x="0" y="222" width="126" height="34" rx="17" fill="#052E1A" stroke="#16A34A" stroke-opacity="0.55"/>
    <text x="63" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#86EFAC">OPEN TO BUILD</text>
    <rect x="140" y="222" width="94" height="34" rx="17" fill="#082F49" stroke="#0EA5E9" stroke-opacity="0.55"/>
    <text x="187" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#7DD3FC">JAVA 21</text>
  </g>

  <g transform="translate(378 112)">
    <text x="0" y="46" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#F8FAFC">Newbie1402</text>
    <text x="2" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#86EFAC">Clean backend systems.</text>
    <text x="2" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CBD5E1">Java • Spring Boot • Laravel • SQL • React basics</text>

    <g transform="translate(2 158)">
      <rect x="0" y="0" width="126" height="38" rx="11" fill="#111827" stroke="#1F2937"/>
      <text x="18" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#22C55E">REST APIs</text>
      <rect x="142" y="0" width="144" height="38" rx="11" fill="#111827" stroke="#1F2937"/>
      <text x="160" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#38BDF8">Service layers</text>
      <rect x="302" y="0" width="122" height="38" rx="11" fill="#111827" stroke="#1F2937"/>
      <text x="320" y="25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#CBD5E1">Databases</text>
    </g>
  </g>

  <g transform="translate(108 374)">
    <rect x="0" y="0" width="206" height="82" rx="18" fill="#0B1220" stroke="#1E293B"/>
    <text x="22" y="32" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#86EFAC">BUILD FOCUS</text>
    <text x="22" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Readable APIs</text>

    <rect x="234" y="0" width="206" height="82" rx="18" fill="#0B1220" stroke="#1E293B"/>
    <text x="256" y="32" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#7DD3FC">DATA FLOWS</text>
    <text x="256" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Import &amp; search</text>

    <rect x="468" y="0" width="206" height="82" rx="18" fill="#0B1220" stroke="#1E293B"/>
    <text x="490" y="32" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#CBD5E1">TOOLKIT</text>
    <text x="490" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Docker • Postman</text>
  </g>
</svg>
